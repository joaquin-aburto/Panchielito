<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchielito</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="../img/chielito-re.png">
    <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        /* Estilos para el modal de términos y condiciones */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(46, 24, 24, 0.85); /* Fondo tinto oscuro semitransparente */
            backdrop-filter: blur(4px); /* Efecto de desenfoque sutil */
            animation: fadeIn 0.3s ease-out;
        }
    
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    
        .modal-content {
            background: linear-gradient(135deg, #fff9f0 0%, #fff4e6 100%); /* Degradado amarillo tenue */
            margin: 8% auto;
            padding: 25px;
            border: none;
            width: 85%;
            max-width: 650px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(94, 38, 38, 0.3); /* Sombra tinta */
            border: 1px solid #e0c9a6; /* Borde dorado claro */
            animation: slideDown 0.3s ease-out;
        }
    
        @keyframes slideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d4b483; /* Línea divisoria dorada */
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
    
        .modal-title {
            font-size: 1.6rem;
            margin: 0;
            color: #5c2e2e; /* Color tinto para el texto */
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    
        .close {
            color: #b38b6d; /* Color dorado oscuro */
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
        }
    
        .close:hover {
            color: #8a2e2e; /* Tinto más intenso al hover */
            transform: scale(1.1);
        }
    
        .modal-body {
            margin-bottom: 25px;
            line-height: 1.7;
            color: #5c3a21; /* Color marrón oscuro para texto legible */
            font-size: 1.05rem;
        }
    
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            border-top: 1px solid #d4b483; /* Línea divisoria dorada */
            padding-top: 20px;
        }
    
        .modal-btn {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    
        .btn-accept {
            background-color: #8a2e2e; /* Tinto */
            color: #fff4e6; /* Amarillo tenue para texto */
        }
    
        .btn-accept:hover {
            background-color: #6d2323; /* Tinto más oscuro */
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(138, 46, 46, 0.2);
        }
    
        .btn-cancel {
            background-color: #d4b483; /* Dorado */
            color: #5c2e2e; /* Tinto para texto */
        }
    
        .btn-cancel:hover {
            background-color: #c0a070; /* Dorado más oscuro */
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(212, 180, 131, 0.3);
        }
    
        /* Nuevo estilo para el botón de descarga */
        .btn-download {
            background-color: #4a6741; /* Verde oscuro */
            color: #fff4e6; /* Amarillo tenue para texto */
        }
    
        .btn-download:hover {
            background-color: #3a5233; /* Verde más oscuro */
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(74, 103, 65, 0.2);
        }
    
        .terms-checkbox-container {
            display: flex;
            align-items: center;
            margin: 20px 0;
            padding: 12px;
            background-color: rgba(212, 180, 131, 0.1); /* Fondo dorado muy tenue */
            border-radius: 6px;
            border-left: 3px solid #d4b483; /* Acento dorado */
        }
    
        .terms-checkbox-container input {
            margin-right: 12px;
            accent-color: #8a2e2e; /* Color tinto para el checkbox */
        }
    
        .terms-link {
            color: #8a2e2e; /* Tinto */
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dashed #b38b6d; /* Subrayado dorado discontinuo */
            transition: all 0.2s;
        }
    
        .terms-link:hover {
            color: #6d2323; /* Tinto más oscuro */
            border-bottom-color: #8a2e2e; /* Tinto al hover */
        }
    
        /* Estilos mejorados para los términos */
        .terms-section {
            margin-bottom: 25px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(92, 46, 46, 0.05);
        }
    
        .terms-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #8a2e2e; /* Tinto */
            display: flex;
            align-items: center;
        }
    
        .terms-title:before {
            content: "•";
            color: #d4b483; /* Dorado */
            margin-right: 10px;
            font-size: 1.8rem;
        }
    
        .terms-content {
            margin-left: 20px;
            padding-left: 10px;
            border-left: 2px solid #e0c9a6; /* Línea vertical dorada */
        }
    
        .terms-paragraph {
            margin-bottom: 12px;
            text-align: justify;
        }
    
        .terms-list {
            margin-left: 25px;
            margin-bottom: 15px;
            list-style-type: none;
        }
    
        .terms-list-item {
            margin-bottom: 8px;
            position: relative;
            padding-left: 25px;
        }
    
        .terms-list-item:before {
            content: "→";
            color: #d4b483; /* Dorado */
            position: absolute;
            left: 0;
        }
    
        /* Scrollbar personalizada para el modal */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }
    
        .modal-content::-webkit-scrollbar-track {
            background: #f1e9d9;
            border-radius: 4px;
        }
    
        .modal-content::-webkit-scrollbar-thumb {
            background-color: #b38b6d;
            border-radius: 4px;
        }
    
        .modal-content::-webkit-scrollbar-thumb:hover {
            background-color: #8a2e2e;
        }
    </style>
</head>
<body>
    
    <video class="background-video" autoplay muted loop>
        <source src="img/Login.mp4" type="video/mp4">
        Tu navegador no soporta videos HTML5.
    </video>

   
    <div class="container">
      
        <a href="https://panchielito.com/">
          <img src="img/Chielito.png" alt="Se un biscochito más" class="header-image">
        </a>


        
        <div class="submenu">
            <button class="submenu-btn" onclick="showForm('register')">Regístrate</button>
            <button class="submenu-btn" onclick="showForm('login')">Inicia Sesión</button>
        </div>

        
        <div class="mt-3" id="respuesta">    
        </div>
        <form id="register-form" class="formulario hidden" onsubmit="submitForm(event, 'register')">

            <h2>Regístrate</h2>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required>

            <label for="telefono">Número de Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>

            <label for="pan">Variedad de Pan Favorita:</label>
            <select id="pan" name="pan" required>
                <option value="bizcocho">Bizcocho</option>
                <option value="danes">Danés</option>
                <option value="hojaldre">Hojaldre</option>
            </select>
            
            <!-- Agregar casilla de términos y condiciones -->
            <div class="terms-checkbox-container">
                <input type="checkbox" id="accept-terms" name="accept-terms">
                <label for="accept-terms">He leído y acepto los <span class="terms-link" onclick="showTermsModal()">términos y condiciones</span></label>
            </div>
            
            <div class="button-group">
                <input type="submit" value="Enviar" class="submit-btn">
                <input type="reset" value="Limpiar" class="reset-btn">
            </div>
        </form>

        

       
        <form id="login-form" onsubmit="submitForm(event, 'login')" class="formulario hidden">
            <h2>Inicia Sesión</h2>
            <label for="login-email">Correo Electrónico:</label>
            <input type="email" id="login-email" name="email" required>
        
            <label for="login-password">Contraseña:</label>
            <input type="password" id="login-password" name="password" required>
        
           
            <input type="submit" value="Iniciar Sesión" class="submit-btn">
        </form>
    </div>

    <!-- Modal de Términos y Condiciones -->
    <div id="termsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="termsTitle">Términos y Condiciones</h2>
                <span class="close" onclick="closeTermsModal()">&times;</span>
            </div>
            <div class="modal-body" id="termsContent">
                Cargando términos y condiciones...
            </div>
            <div class="modal-footer">
                <button class="modal-btn btn-accept" onclick="acceptTerms()">Aceptar</button>
                <button class="modal-btn btn-cancel" onclick="cancelTerms()">Cancelar</button>
                <button class="modal-btn btn-download" onclick="downloadTerms()">Descargar PDF</button>
            </div>
        </div>
    </div>

    <script>
        function showForm(formId) {
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById(`${formId}-form`).classList.remove('hidden');
        }
        
        // Variables para los términos y condiciones
        let termsData = null;
        
        // Cargar los términos y condiciones al iniciar la página
        document.addEventListener('DOMContentLoaded', function() {
            loadTermsAndConditions();
        });
        
        // Función para formatear los términos y condiciones
        function formatTermsAndConditions(text) {
            if (!text) return '';
            
            // Dividir el texto por líneas
            const lines = text.split('\n');
            let formattedHtml = '';
            let inSection = false;
            let inList = false;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Si la línea está vacía, cerrar cualquier lista abierta y agregar un espacio
                if (line === '') {
                    if (inList) {
                        formattedHtml += '</div>'; // Cerrar .terms-list
                        inList = false;
                    }
                    continue;
                }
                
                // Detectar encabezados (números seguidos de punto y espacio)
                if (/^\d+\.\s+/.test(line)) {
                    // Si estamos en una sección anterior, cerrarla
                    if (inSection) {
                        formattedHtml += '</div>'; // Cerrar .terms-content
                        formattedHtml += '</div>'; // Cerrar .terms-section
                    }
                    
                    // Iniciar nueva sección
                    inSection = true;
                    const title = line;
                    formattedHtml += '<div class="terms-section">';
                    formattedHtml += `<div class="terms-title">${title}</div>`;
                    formattedHtml += '<div class="terms-content">';
                    continue;
                }
                
                // Detectar elementos de lista (guiones o viñetas)
                if (line.startsWith('–') || line.startsWith('-')) {
                    if (!inList) {
                        inList = true;
                        formattedHtml += '<div class="terms-list">';
                    }
                    
                    const listItemContent = line.substring(1).trim();
                    formattedHtml += `<div class="terms-list-item">${listItemContent}</div>`;
                    continue;
                }
                
                // Si no es un encabezado ni un elemento de lista, es un párrafo normal
                if (inList) {
                    formattedHtml += '</div>'; // Cerrar .terms-list
                    inList = false;
                }
                
                formattedHtml += `<div class="terms-paragraph">${line}</div>`;
            }
            
            // Cerrar cualquier sección abierta al final
            if (inList) {
                formattedHtml += '</div>'; // Cerrar .terms-list
            }
            
            if (inSection) {
                formattedHtml += '</div>'; // Cerrar .terms-content
                formattedHtml += '</div>'; // Cerrar .terms-section
            }
            
            return formattedHtml;
        }
        
        // Función para cargar los términos y condiciones desde la base de datos
        function loadTermsAndConditions() {
            fetch('https://panchielito.com/Login/obtener_terminos.php')
                .then(response => response.json())
                .then(data => {
                    termsData = data;
                    document.getElementById('termsTitle').textContent = data.nombre;
                    
                    // Formatear el contenido de los términos y condiciones
                    const formattedContent = formatTermsAndConditions(data.descripcion);
                    document.getElementById('termsContent').innerHTML = formattedContent;
                })
                .catch(error => {
                    console.error('Error al cargar los términos y condiciones:', error);
                    document.getElementById('termsContent').textContent = 'Error al cargar los términos y condiciones. Por favor, inténtelo de nuevo más tarde.';
                });
        }
        
        // Mostrar el modal de términos y condiciones
        function showTermsModal() {
            document.getElementById('termsModal').style.display = 'block';
        }
        
        // Cerrar el modal de términos y condiciones
        function closeTermsModal() {
            document.getElementById('termsModal').style.display = 'none';
        }
        
        // Aceptar los términos y condiciones
        function acceptTerms() {
            document.getElementById('accept-terms').checked = true;
            closeTermsModal();
        }
        
        // Cancelar los términos y condiciones
        function cancelTerms() {
            document.getElementById('accept-terms').checked = false;
            closeTermsModal();
        }
        
        // Función para descargar los términos y condiciones en PDF
        function downloadTerms() {
            if (termsData) {
                // Redirigir a la página de generación de PDF con los datos necesarios
                window.open(`https://panchielito.com/Login/descargar_terminos_html.php`, '_blank');
            } else {
                alert('Error: No se pudieron cargar los términos y condiciones. Por favor, inténtelo de nuevo más tarde.');
            }
        }
        
        // Cerrar el modal si se hace clic fuera de él
        window.onclick = function(event) {
            const modal = document.getElementById('termsModal');
            if (event.target === modal) {
                closeTermsModal();
            }
        }
    </script>
    
    <script src="js/autenticar.js"></script>
</body>
</html>
